<style>
/* Layout: technical magazine. Home = cover + pinned spreads (article left, 3D plate right) + procedure + appendix.
   Works = index with terrain filters. Project = feature article with plate, spec sheet and numbered sections. About = profile + colophon. */
:root{
  --paper:#ECECE7;       /* neutral coated paper */
  --paper-2:#E1E1DB;
  --sheet:#F5F5F1;
  --ink:#141413;
  --ink-2:#5D5D57;
  --rule:rgba(20,20,19,.16);
  --spot:#FF5B14;        /* safety orange, spot ink */
  --on-spot:#141413;
  --serif:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --sans:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
  --pad:clamp(0px,2.2vw,36px);
  --head:44px;
  --ease:cubic-bezier(.2,.7,.1,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121211; --paper-2:#1B1B19; --sheet:#181816; --ink:#E9E8E2; --ink-2:#9A9991; --rule:rgba(233,232,226,.15);
    --spot:#FF6A2B; --on-spot:#121211; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121211; --paper-2:#1B1B19; --sheet:#181816; --ink:#E9E8E2; --ink-2:#9A9991; --rule:rgba(233,232,226,.15);
  --spot:#FF6A2B; --on-spot:#121211; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .5s,color .5s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:85;background-image:var(--noise,none);opacity:.07;mix-blend-mode:multiply}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body::after{mix-blend-mode:screen;opacity:.04}}
:root[data-theme="dark"] body::after{mix-blend-mode:screen;opacity:.04}
a{color:inherit}
::selection{background:var(--spot);color:var(--on-spot)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--spot);outline-offset:3px}
.skip{position:fixed;left:var(--gl,16px);top:10px;z-index:100;transform:translateY(-200%);padding:8px 12px;background:var(--paper);color:var(--ink);border:1px solid var(--ink);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
.skip:focus{transform:none}
main:focus{outline:none}
h1,h2,h3{margin:0;font-weight:inherit;text-wrap:balance}
p{margin:0}
em{font-style:italic}
img{display:block;max-width:100%;height:auto}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.wrap{padding-left:var(--gl);padding-right:var(--gr)}
.inner{max-width:1480px;margin:0 auto;padding-inline:var(--pad)}
.ln{display:block;overflow:hidden;padding:.14em 0 .06em;margin:-.14em 0 -.06em}
.ln > span{display:inline-block}

/* canvas */
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
#leaders{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
#leaders line{stroke:var(--ink);stroke-width:.8}
#leaders circle{fill:var(--paper);stroke:var(--ink);stroke-width:1}
#labels{position:fixed;inset:0;z-index:2;pointer-events:none}
.lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;white-space:nowrap;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;opacity:0;transition:opacity .3s}
.lbl b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--ink);font-weight:500;font-size:9.5px;background:var(--paper)}
.lbl span{background:color-mix(in srgb,var(--paper) 94%,transparent);padding:2px 4px}
.lbl.r{flex-direction:row-reverse}

/* print intro + page wipe */
#intro{position:fixed;inset:0;z-index:95;background:var(--paper);display:grid;place-items:center;clip-path:inset(0 0 0 0);animation:introOut .01s 3.4s forwards}
.reg{width:84px;height:84px;position:relative}
.reg::before,.reg::after{content:"";position:absolute;background:var(--ink)}
.reg::before{left:50%;top:0;bottom:0;width:1px}
.reg::after{top:50%;left:0;right:0;height:1px}
.reg i{position:absolute;inset:18px;border:1px solid var(--ink);border-radius:50%}
.reg i::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--spot)}
#intro .bar{position:absolute;left:var(--gl);right:var(--gr);bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:12px;padding-inline:24px;color:var(--ink-2)}
#intro .bar b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
@keyframes introOut{to{visibility:hidden;opacity:0}}
#wipe{position:fixed;inset:0;z-index:94;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--gr) calc(28px + env(safe-area-inset-bottom,0px)) var(--gl);visibility:hidden;pointer-events:none}
#wipe .t{font-family:var(--serif);font-weight:300;font-size:clamp(56px,11vw,180px);line-height:.85;letter-spacing:-.04em;padding-inline:24px}
#wipe .t em{color:var(--spot)}
#wipe .mono{padding:0 24px 10px;opacity:.7}

/* running head */
.runhead{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:var(--paper);border-bottom:1px solid var(--rule);padding-left:var(--gl);padding-right:var(--gr)}
.runhead .inner{height:var(--head);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.runhead .who{font-family:var(--serif);font-size:16px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runhead .who em{color:var(--ink-2)}
.runhead nav{display:flex;gap:clamp(10px,1.8vw,26px)}
.runhead nav a{text-decoration:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;position:relative}
.runhead nav a::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:var(--spot);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.runhead nav a:hover::after,.runhead nav a[aria-current="page"]::after{transform:scaleX(1)}
.runhead .right{display:flex;justify-content:flex-end;align-items:center;gap:14px}
.folio{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.folio b{color:var(--ink);font-weight:500}
.theme{display:grid;place-items:center;width:34px;height:34px;padding:0;border:0;border-radius:50%;background:none;color:var(--ink);cursor:pointer;flex:none}
.theme:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.theme svg{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.theme .moon{display:none}
:root[data-theme="dark"] .theme .sun{display:none}:root[data-theme="dark"] .theme .moon{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .theme .sun{display:none}:root:not([data-theme="light"]) .theme .moon{display:block}}
.langs{display:inline-flex;gap:2px}.langs a{display:inline-grid;place-items:center;min-width:26px;min-height:26px;padding:0 1px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-decoration:none}.langs a:hover,.langs a[aria-current]{color:var(--ink)}
.runhead .mnav{display:none;height:auto;grid-template-columns:none;gap:14px;padding:8px 0 10px;border-top:1px solid var(--rule)}
.mnav a{text-decoration:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.mnav a[aria-current="page"]{color:var(--ink);text-decoration:underline 2px var(--spot);text-underline-offset:5px}
.progress{position:fixed;top:calc(var(--head) + env(safe-area-inset-top,0px));left:0;height:2px;width:100%;background:var(--spot);transform-origin:0 50%;transform:scaleX(0);z-index:51}
@media (max-width:860px){
  :root{--head:44px}
  .runhead nav{display:none}.runhead .inner{grid-template-columns:minmax(0,1fr) auto}.runhead .who em{display:none}
  .runhead .mnav{display:flex}
  .progress{top:calc(var(--head) + 37px + env(safe-area-inset-top,0px))}
  .view{--hx:37px}
}

/* cover */
.view{--hx:0px}
@media (max-width:860px){.view{--hx:37px}}
#cover{position:relative;min-height:100svh;padding-top:calc(var(--head) + var(--hx) + env(safe-area-inset-top,0px) + 14px);padding-bottom:20px}
.cover{display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px;min-height:calc(100svh - var(--head) - 40px);grid-template-rows:auto auto 1fr}
.issue{grid-column:1 / -1;display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);color:var(--ink-2)}
.issue span{padding:8px 0}
.issue span + span{padding-left:12px;border-left:1px solid var(--rule)}
.issue b{color:var(--ink);font-weight:500}
.mast{grid-column:1 / -1;font-family:var(--serif);font-size:clamp(68px,15.4vw,236px);line-height:.84;letter-spacing:-.045em;font-weight:300;font-variation-settings:'opsz' 72;margin:26px 0 0 -.04em;white-space:nowrap}
.mast .ch{display:inline-block}
.cover-left{grid-column:1 / span 4;display:flex;flex-direction:column;gap:22px;padding-top:22px;min-width:0}
.cover-deck{font-family:var(--serif);font-size:clamp(20px,1.7vw,26px);line-height:1.22;font-weight:350;letter-spacing:-.01em}
.cover-deck em{color:var(--spot)}
.cover-meta{margin:0;font-size:10.5px;line-height:1.5;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.cover-meta::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--spot);margin-right:8px;vertical-align:1px}
.m-only{display:none}
.nw{white-space:nowrap}
@media (max-width:900px){.m-only{display:inline}.d-only{display:none}}
.lines{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.lines li{border-bottom:1px solid var(--rule)}
.lines button{width:100%;display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:baseline;text-align:left;padding:9px 0;transition:padding .35s var(--ease)}
.lines button:hover{padding-left:8px}
.lines .pg{font-family:var(--mono);font-size:11px;color:var(--spot)}
.lines .tt{font-family:var(--serif);font-size:19px;line-height:1.15;letter-spacing:-.01em}
.lines .ct{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.cover-fig{grid-column:6 / -1;position:relative;min-height:420px;margin:22px 0 0}
.cover-fig figcaption{position:absolute;right:0;bottom:0;max-width:34ch;text-align:right;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink-2);line-height:1.35}
.cover-fig figcaption b{font-family:var(--mono);font-style:normal;font-weight:500;font-size:10.5px;letter-spacing:.06em;color:var(--ink);text-transform:uppercase}
.cover-fig .tag{position:absolute;left:0;top:0;color:var(--ink-2)}
@media (max-width:900px){
  .issue{grid-template-columns:1fr 1fr}.issue span:nth-child(3){padding-left:0;border-left:0}
  .issue span:nth-child(n+3){border-top:1px solid var(--rule)}
  .cover-left{grid-column:1 / -1;order:3}.cover-fig{grid-column:1 / -1;min-height:50svh;order:2}
  .mast{white-space:normal}
}

/* spreads */
#theatre{position:relative;height:calc(5 * 140svh)}
.spread{position:sticky;top:0;height:100svh;padding-top:calc(var(--head) + var(--hx) + env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.spread > .inner{flex:1;width:100%;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-rows:minmax(0,1fr) auto;gap:14px clamp(20px,3vw,48px);min-height:0}
.arts{position:relative;min-height:0;border-top:2px solid var(--ink)}
.art{position:absolute;inset:0;display:flex;flex-direction:column;gap:clamp(10px,1.6vh,20px);padding-top:12px;visibility:hidden}
.art.on{visibility:visible}
.kick{display:flex;justify-content:space-between;gap:12px;color:var(--ink-2)}
.kick b{color:var(--spot);font-weight:500}
.art h2{font-family:var(--serif);font-weight:330;font-variation-settings:'opsz' 72;font-size:clamp(38px,4.3vw,76px);line-height:.98;letter-spacing:-.03em;margin-top:6px}
.art .deck{font-family:var(--serif);font-style:italic;font-weight:350;font-size:clamp(19px,1.55vw,24px);line-height:1.25;color:var(--ink-2);max-width:32ch}
.art .body{display:grid;grid-template-columns:96px 1fr;gap:14px;border-top:1px solid var(--rule);padding-top:12px;font-size:15px;max-width:52ch}
.art .body .mono{color:var(--ink-2);padding-top:3px}
.art .spec{margin:6px 0 0;display:grid;grid-template-columns:96px 1fr;font-size:14px;border-top:1px solid var(--ink)}
.art .spec dt,.art .spec dd{margin:0;padding:7px 0;border-bottom:1px solid var(--rule)}
.art .spec dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding-top:9px}
.art .more{align-self:flex-start;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--spot);padding-bottom:2px}
.art .more:hover{color:var(--spot)}
a.stamp,a.addr{text-decoration:none}a.stamp:hover,a.addr:hover{text-decoration:underline}
.stamp{display:inline-block;background:var(--spot);color:var(--on-spot);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px}
.plate{position:relative;min-height:0;border:1px solid var(--rule);margin:0}
.plate .cm{position:absolute;width:14px;height:14px;border:0 solid var(--ink);z-index:3}
.plate .cm:nth-child(1){left:-1px;top:-1px;border-left-width:2px;border-top-width:2px}
.plate .cm:nth-child(2){right:-1px;top:-1px;border-right-width:2px;border-top-width:2px}
.plate .cm:nth-child(3){left:-1px;bottom:-1px;border-left-width:2px;border-bottom-width:2px}
.plate .cm:nth-child(4){right:-1px;bottom:-1px;border-right-width:2px;border-bottom-width:2px}
.ptop{position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:3}
.figno{font-family:var(--serif);font-size:clamp(34px,3vw,52px);line-height:.8;font-weight:300;letter-spacing:-.03em}
.figno small{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);margin-left:8px;vertical-align:top}
.modes{display:flex;border:1px solid var(--rule);background:var(--paper)}
.modes button{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:6px 9px}
.modes button + button{border-left:1px solid var(--rule)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pcap{position:absolute;left:14px;right:14px;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;z-index:3}
.pcap p{font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.35;color:var(--ink-2);max-width:46ch}
.pcap p b{font-family:var(--mono);font-style:normal;font-weight:500;font-size:10.5px;letter-spacing:.06em;color:var(--ink);text-transform:uppercase}
.pcap p span.num{font-family:var(--mono);font-style:normal;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}

/* the app: runs once the deferred libraries (three, GSAP, Lenis) have executed */
addEventListener('DOMContentLoaded',function(){
/* the 404 page under /es/ or /eu/ has loaded that language's content (see build-pages.mjs): render all of it */
if(window.__rebody)document.body.innerHTML=bodyHTML();
/* each URL is built with only its own view filled in (crawlers and AI readers get just that page); the other
   views come from the same render functions, before anything below looks them up */
(function(){const empty=[...document.querySelectorAll('main > .view:empty')];if(!empty.length)return;
  const t=document.createElement('template');t.innerHTML=bodyHTML();
  empty.forEach(v=>{const s=t.content.getElementById(v.id);if(s)v.replaceChildren(...s.childNodes)})})();
/* /@motion or ?motion in the URL forces full motion even with reduced motion turned on; it lasts the browser session */
let forceMotion=location.pathname.includes('@motion')||/(^|[?&])motion(=|&|$)/.test(location.search.slice(1));
try{if(forceMotion)sessionStorage.setItem('motion','1');else forceMotion=sessionStorage.getItem('motion')==='1'}catch(e){}
const reduce=!forceMotion&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const fine=matchMedia('(pointer:fine)').matches;
const root=document.documentElement;root.lang=D.lang;root.classList.toggle('force-motion',forceMotion);
/* the head timer already revealed the page (slow load): don't hide and replay what is on screen */
const late=!root.classList.contains('boot');let skipIntro=late;
const hasGSAP=typeof gsap!=='undefined';
const css=n=>getComputedStyle(root).getPropertyValue(n).trim();
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
const $=id=>document.getElementById(id);
let px=-9999,py=-9999;
addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY},{passive:true});
const N=5;
const S={cf:0,heroP:0,view:'home'};
const byId=Object.fromEntries(PROJ.map(p=>[p.id,p]));

/* paper texture */
if(false)try{const c=document.createElement('canvas');c.width=c.height=140;const x=c.getContext('2d');const d=x.createImageData(140,140);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);
  root.style.setProperty('--noise',`url(${c.toDataURL()})`)}catch(e){}

/* theme: a sun or a moon (CSS shows the one for the theme in use). It follows the system until clicked, then
   toggles light / dark, remembered */
const themeBtn=$('themeBtn'),sysDark=matchMedia('(prefers-color-scheme: dark)');let theme='auto';
try{const s=localStorage.getItem('ma-theme');if(s==='light'||s==='dark')theme=s}catch(e){}
const themeHooks=[];
const isDark=()=>theme==='dark'||(theme==='auto'&&sysDark.matches);
function setTheme(){if(theme==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',theme);
  const label=UI.theme+': '+(isDark()?UI.themeDark:UI.themeLight);themeBtn.setAttribute('aria-label',label);themeBtn.title=label;
  try{localStorage.setItem('ma-theme',theme)}catch(e){}
  requestAnimationFrame(()=>themeHooks.forEach(f=>f()))}
setTheme();themeBtn.addEventListener('click',()=>{theme=isDark()?'light':'dark';setTheme()});
sysDark.addEventListener('change',()=>{if(theme==='auto')setTheme()});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>themeHooks.forEach(f=>f()));

/* ===================== 3D KIT ===================== */
const K3=(function(){
  if(typeof THREE==='undefined')return null;
  const V=(x,y,z)=>new THREE.Vector3(x,y,z);
  function rshape(w,h,r){const s=new THREE.Shape(),x=-w/2,y=-h/2;r=Math.min(r,w/2,h/2);
    s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}
  function rbox(w,h,d,r,b){b=b===undefined?Math.min(.04,d/4):b;
    const g=new THREE.ExtrudeGeometry(rshape(w-b*2,h-b*2,Math.max(.001,r-b)),{depth:Math.max(.001,d-b*2),bevelEnabled:b>0,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:12});g.center();return g}
  function tube(pts,r,closed){return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p=>V(...p)),!!closed,'catmullrom',closed?0:.5),96,r,14,!!closed)}
  function merge(geos){const pos=[],nor=[];geos.forEach(g=>{g=g.index?g.toNonIndexed():g;pos.push(...g.attributes.position.array);nor.push(...g.attributes.normal.array)});
    const m=new THREE.BufferGeometry();m.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));m.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));return m}
  function makeMats(){const P=o=>new THREE.MeshStandardMaterial(Object.assign({transparent:true},o));
    return{body:P({roughness:.85,metalness:0}),paint:P({roughness:.5,metalness:.1}),dark:P({roughness:.7,metalness:0}),
      metal:P({roughness:.3,metalness:.95}),mirror:P({roughness:.04,metalness:1}),accent:P({roughness:.55,metalness:0}),
      pcb:P({roughness:.6,metalness:.1,side:THREE.DoubleSide}),glass:P({roughness:.1,metalness:0,opacity:.22,side:THREE.DoubleSide,depthWrite:false}),
      ghost:P({roughness:1,opacity:.1,depthWrite:false}),edge:new THREE.LineBasicMaterial({transparent:true})}}
  function Model(parent){const g=new THREE.Group();const m={g,parts:[],mats:makeMats(),scale:1,spinners:[]};parent.add(g);
    /* the renderer updates every matrix in the scene each frame; skip hidden models (the frame that shows one
       again sets its transform, which updates the whole subtree) */
    g.updateMatrixWorld=function(force){if(this.visible)THREE.Object3D.prototype.updateMatrixWorld.call(this,force)};return m}
  function part(M,geo,mk,pos,off,o={}){
    const mesh=new THREE.Mesh(geo,M.mats[mk]);const holder=new THREE.Group();const inner=new THREE.Group();inner.add(mesh);holder.add(inner);
    if(o.rot)inner.rotation.set(...o.rot);if(o.scale)inner.scale.set(...o.scale);if(o.shift)inner.position.set(...o.shift);
    if(!o.noEdge){const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo,o.th||28),M.mats.edge);inner.add(e)}
    holder.position.copy(pos);M.g.add(holder);
    const p={h:holder,inner,base:pos.clone(),off:off||V(0,0,0),rotOff:o.rotOff||null,label:LBL(o.label),mesh,mk};M.parts.push(p);
    if(o.spin)M.spinners.push([inner,o.spin]);return p}
  const B=[];
  /* 0 · SEAT mirror */
  B[0]=M=>{
    part(M,new THREE.SphereGeometry(1,64,32,Math.PI/2,Math.PI),'paint',V(0,0,-.05),V(0,.1,-1.5),{label:'Housing · PCTFE',th:50,scale:[1.75,1.05,.85]});
    part(M,rbox(3.0,1.75,.14,.55),'dark',V(0,0,.02),V(0,0,.55),{label:'Mirror carrier'});
    part(M,rbox(2.9,1.65,.05,.52),'mirror',V(0,0,.12),V(0,0,1.5),{label:'Heated mirror glass'});
    part(M,new THREE.CylinderGeometry(.34,.34,.42,40),'metal',V(0,0,-.42),V(0,.05,-.55),{rot:[Math.PI/2,0,0],label:'Folding motor'});
    part(M,new THREE.TorusGeometry(1.0,.05,12,80,Math.PI*.55),'accent',V(.1,.05,-.1),V(.5,.45,-.9),{rot:[0,0,-.2],scale:[1.75,1.05,1],label:'Dynamic LED indicator'});
    part(M,new THREE.CylinderGeometry(.11,.11,.18,24),'dark',V(1.1,-.82,-.3),V(.4,-.75,0),{label:'Camera'});
    part(M,new THREE.CylinderGeometry(.09,.09,.12,20),'metal',V(-.4,-.86,-.35),V(-.2,-.8,0),{label:'Ultrasonic sensor'});
    part(M,rbox(.55,1.1,.45,.14),'body',V(-1.35,-.95,-.35),V(-.9,-1.0,-.2),{label:'Base arm'});
    M.scale=.92};
  /* 1 · Ardura */
  B[1]=M=>{
    part(M,new THREE.CylinderGeometry(1.0,1.0,1.25,96),'body',V(0,-1.05,0),V(0,-1.3,0),{label:'Base shell · rPP + talc'});
    part(M,rbox(.2,.8,.06,.1),'dark',V(0,-1.05,1.0),V(0,-1.3,.2),{label:'Level window'});
    part(M,new THREE.CylinderGeometry(.86,.84,1.1,64,1,true),'glass',V(0,-1.0,0),V(1.9,-.1,0),{label:'Retractable tank · rPET',th:40});
    part(M,new THREE.TorusGeometry(.32,.05,12,40,Math.PI),'glass',V(0,-.42,0),V(1.9,-.1,0),{th:40});
    part(M,new THREE.CylinderGeometry(1.0,1.0,.3,96),'dark',V(0,-.27,0),V(0,.25,0),{label:'Tech module · PCB, battery'});
    part(M,new THREE.CylinderGeometry(.14,.14,.26,24),'metal',V(.45,-.27,0),V(.55,.7,0),{label:'Micro-pump'});
    part(M,rbox(.34,.08,.1,.035),'accent',V(0,-.27,1.02),V(0,.25,.35),{label:'Mode slider'});
    const prof=[[0,-.6],[1.0,-.6],[1.03,.72],[.95,.72],[.92,-.5],[0,-.5]].map(p=>new THREE.Vector2(p[0],p[1]));
    const pot=part(M,new THREE.LatheGeometry(prof,96),'body',V(0,.5,0),V(0,1.2,0),{label:'Pot · rPP'});
    part(M,new THREE.CylinderGeometry(1.045,1.045,.85,96,1,true,-1,2),'pcb',V(0,.55,0),V(0,1.2,.45),{label:'OPV solar film',th:60});
    part(M,new THREE.TorusGeometry(.6,.035,10,64),'accent',V(0,.15,0),V(0,2.0,0),{rot:[Math.PI/2,0,0],label:'Irrigation ring'});
    const leaf=new THREE.Shape();leaf.moveTo(0,0);leaf.bezierCurveTo(.35,.25,.35,.75,0,1.05);leaf.bezierCurveTo(-.35,.75,-.35,.25,0,0);
    const lg=new THREE.ShapeGeometry(leaf,20);M.leafMat=new THREE.MeshStandardMaterial({side:THREE.DoubleSide,roughness:.8,transparent:true});
    const le=new THREE.EdgesGeometry(lg,10);
    for(let i=0;i<6;i++){const l=new THREE.Mesh(lg,M.leafMat);const ll=new THREE.LineSegments(le,M.mats.edge);const gg=new THREE.Group();gg.add(l,ll);
      gg.rotation.set(0,i/6*Math.PI*2,.3+(i%3)*.12);gg.scale.setScalar(.5+(i%3)*.12);gg.position.y=.55;pot.inner.add(gg)}
    M.scale=.9};
  /* 2 · Cycle Dry */
  B[2]=M=>{
    [-.45,.45].forEach((z,k)=>part(M,tube([[-1.75,.45,z],[0,.45,z],[1.3,.45,z],[1.62,.28,z]],.055),'metal',V(0,0,0),V(0,.5,z*.9),{label:k?'Bent frame · Al 6061':null}));
    [-1.75,1.1].forEach((x,k)=>part(M,new THREE.CylinderGeometry(.045,.045,.95,16),'metal',V(x,.45,0),V(k?.4:-.5,.5,0),{rot:[Math.PI/2,0,0],label:k?'Front bar':'Rear bar'}));
    part(M,rbox(2.3,.04,.62,.08),'body',V(-.1,.5,0),V(0,1.3,0),{label:'Load platform'});

    b.addEventListener('pointermove',ev=>{const r=b.getBoundingClientRect();gsap.to(b,{x:(ev.clientX-r.left-r.width/2)*.25,y:(ev.clientY-r.top-r.height/2)*.3,duration:.4,ease:'power3.out'})});
    b.addEventListener('pointerleave',()=>gsap.to(b,{x:0,y:0,duration:.7,ease:'elastic.out(1,.4)'}))})}

addEventListener('load',()=>ScrollTrigger.refresh());

/* scroll cue: home only, hidden near the end */
(function(){const cue=$('scue'),txt=$('scueT');
  function upd(){const doc=document.documentElement;const end=doc.scrollHeight-innerHeight-scrollY<160;
    const th=$('theatre').getBoundingClientRect();
    /* only over the cover and the projects: past them it would sit on top of the text (Procedure, contact) */
    const on=S.view==='home'&&!end&&th.bottom>innerHeight;cue.classList.toggle('off',!on);
    if(!on)return;
    const s=th.top>innerHeight*.5?UI.scrollOpen:UI.scrollNext;if(txt.textContent!==s)txt.textContent=s}
  addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);addEventListener('route',()=>setTimeout(upd,1400));setInterval(upd,800);upd()})();
});
</script>
</body>
